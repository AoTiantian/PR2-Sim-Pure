schema_version: 1

experiment:
  settle_sec: 2.0
  tracking_sec: 12.0
  hold_sec: 1.0
  publish_rate_hz: 50.0
  output_root: /workspace/results/runs
  frame_id: odom
  human_hand_offset: [1.0, 0.0, 0.0]

trajectory:
  active: sinusoid
  presets:
    sinusoid:
      cycles: 1.0
      position_amplitude_m: [0.20, 0.12, 0.03]
      orientation_amplitude_rad: [0.08, 0.06, 0.10]
    # Waypoint scenarios follow Zhang et al. 2026 (arXiv:2603.03768) scene
    # geometry at reduced scale.  Waypoint rows are [dx, dy, yaw_deg] in the
    # latched anchor's world frame; segment durations must sum to tracking_sec.
    S11:
      tracking_sec: 12.0
      waypoints: [[0, 0, 0], [0, -0.8, 0]]
    S22:
      tracking_sec: 24.0
      waypoints: [[0, 0, 0], [0.3, -0.5, 0], [-0.3, -1.0, 0]]
    S12:
      # 180 deg turnaround, kinematically consistent: the hand sits 1.0 m
      # from the board CoM, so pivoting the board by theta sweeps the hand
      # along a radius-1.0 m semicircle (yaw tracks the arc parameter).
      # Waypoints: COM=(anchor+[-1,0]), hand(t)=COM+1.0*[cos t, sin t].
      tracking_sec: 22.0
      waypoints: [[0, 0, 0], [-0.293, 0.707, 45], [-1.0, 1.0, 90], [-1.707, 0.707, 135], [-2.0, 0.0, 180]]
      segment_durations_sec: [5.0, 6.0, 6.0, 5.0]
      robot_overrides:
        max_angular_velocity: [0.3, 0.3, 0.4]

human_impedance:
  linear_stiffness: [100.0, 100.0, 400.0]
  linear_damping: [15.0, 15.0, 10.0]
  # X stiffness 100->30: the roll-about-long-axis mode is discretely
  # marginal at the 500 Hz rate (damping cap ~2*I/T with tiny I), so more
  # damping self-excites it.  Lowering K raises zeta (~0.19 -> ~0.35),
  # moves the mode away from the delay boundary, and cuts error-to-torque
  # excitation 3x; the axis carries ~zero steady torque so tracking cost
  # is negligible at trajectory bandwidths.
  # X stiffness temporarily back to 100 to replicate the cmd10hz-era
  # configuration (see angular_stiffness note below for why it was lowered
  # to 30 and when to prefer which value).
  angular_stiffness: [100.0, 400.0, 100.0]
  angular_damping: [0.5, 10.0, 5.0]
  force_limit: [60.0, 60.0, 60.0]
  task_torque_limit: [60.0, 60.0, 60.0]

models:
  human_only: /workspace/unitree_mujoco/unitree_robots/pr2/scene_human_board.xml
  human_robot: /workspace/unitree_mujoco/unitree_robots/pr2/scene_grasp_board_long.xml

robot:
  initial_qpos_json: >-
    {"l_shoulder_pan_joint": 0.11735056,
     "l_shoulder_lift_joint": 0.69968519,
     "l_upper_arm_roll_joint": 0.00321579,
     "l_elbow_flex_joint": -1.38673805,
     "l_forearm_roll_joint": -1.78800816,
     "l_wrist_flex_joint": -1.31706743,
     "l_wrist_roll_joint": 2.28528285,
     "l_gripper_l_finger_joint": 0.52,
     "l_gripper_r_finger_joint": 0.52,
     "l_gripper_l_finger_tip_joint": 0.52,
     "l_gripper_r_finger_tip_joint": 0.52}
  ctc_kp: 1000.0
  ctc_kd: 200.0
  admittance:
    mass_linear: [5.0, 5.0, 5.0]
    damping_linear: [80.0, 80.0, 120.0]
    stiffness_linear: [0.0, 0.0, 0.0]
    mass_angular: [0.5, 0.5, 0.5]
    damping_angular: [80.0, 80.0, 80.0]
    # The public QP defines its angular displacement with the opposite sign
    # to its -K*dx term.  Zero avoids a non-physical negative spring while
    # retaining pure mass-damper angular admittance.
    stiffness_angular: [0.0, 0.0, 0.0]
    max_linear_velocity: [0.25, 0.25, 0.10]
    max_angular_velocity: [0.10, 0.10, 0.10]
    wrench_lpf_alpha: 0.06
    cmd_vel_lpf_alpha: 0.10
